# CI von Querencia Files (Zweig querencia): Format, Lints, Tests ohne Bildschirm,
# Bau ohne UnRAR wie die Querencia-Pakete. Die Workflows des Upstreams (ci.yml,
# release.yml, publish-aur.yml …) gehören zu Strata, laufen auf dessen
# Infrastruktur und bleiben unverändert; im Fork bzw. in querencia-files-intern
# werden sie deaktiviert (UPSTREAM.md). Die isolierte GUI-Prüfung läuft nicht hier.
# Prüfbenutzer und LANG wie die Querencia-Vorlage nach GH-7 (21.10.2026); auf GitHub
# für dieses Repo noch nicht gelaufen (Actions in querencia-files-intern aus).
#
# Annahmen:
#  - Querencia Files braucht GTK 4.22, GtkSourceView 5, Poppler, GStreamer (Ubuntu 26.04).
#    GitHubs `ubuntu-latest` ist älter, deshalb läuft der Job im Container
#    `ubuntu:26.04` (Image muss auf Docker Hub verfügbar sein).
#  - Rust 1.98.1 über rustup für den Prüfbenutzer (Ubuntu 26.04 liefert nur 1.93).
#  - Der Container-Job läuft als root. root umgeht Datei- und Ordnerrechte, Tests
#    für „kein Leserecht“/„schreibgeschützt“ schlügen dann fehl. Deshalb laufen
#    fmt, clippy, test und cargo metadata als Prüfbenutzer `pruefer` (`runuser`),
#    mit eigenem HOME und XDG-Ordnern; installiert wird weiter als root.
#  - Das Container-Image setzt kein LANG. Ohne UTF-8-Locale liefert libarchive
#    für Namen mit Umlauten NULL (Querencia Archiv stürzte so ab), deshalb
#    LANG=C.UTF-8 (in glibc eingebaut, kein locales-Paket nötig).
#  - Das Image ist minimal (kein ps, kein update-desktop-database): Werkzeuge,
#    die Tests aufrufen, gehören in ENTWICKLUNGSPAKETE.
name: CI Querencia

on:
  push:
    branches: [querencia]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  LANG: C.UTF-8
  # Prüfbenutzer (nicht root); HOME setzt `runuser`, die XDG-Ordner stehen hier.
  PRUEFER: pruefer
  XDG_CONFIG_HOME: /home/pruefer/.config
  XDG_DATA_HOME: /home/pruefer/.local/share
  XDG_CACHE_HOME: /home/pruefer/.cache
  XDG_STATE_HOME: /home/pruefer/.local/state
  XDG_RUNTIME_DIR: /tmp/xdg-run-pruefer
  # Pro Repo anpassen. Namen für Ubuntu 26.04; auf der Entwicklungs-VM sind gtk4 4.22.4,
  # gtk4-layer-shell-0 1.3.0, vte-2.91-gtk4 0.84.0 als pkg-config-Module vorhanden,
  # die -dev-Paketnamen hier sind auf der VM (Ubuntu 26.04) installiert und damit gültig
  # (GH-2, 19.10.2026); im Container ubuntu:26.04 nicht getestet. python3 braucht der
  # Schritt „Lizenzen der Abhängigkeiten“ (fehlt im Container sonst):
  ENTWICKLUNGSPAKETE: >-
    libgtk-4-dev libglib2.0-dev libcairo2-dev libpango1.0-dev
    libgdk-pixbuf-2.0-dev libgraphene-1.0-dev libgtksourceview-5-dev
    libpoppler-glib-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
    libfontconfig-dev curl

jobs:
  pruefen:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 45
    steps:
      - name: Werkzeuge installieren
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential pkg-config python3 \
            ${ENTWICKLUNGSPAKETE}
          useradd --create-home --shell /bin/bash "$PRUEFER"

      # Strata braucht Rust 1.98.1 (Ubuntu 26.04 liefert 1.93).
      - name: Rust über rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          runuser -u "$PRUEFER" -- sh /tmp/rustup-init.sh -y \
            --default-toolchain 1.98.1 --profile minimal -c clippy -c rustfmt
          echo "/home/$PRUEFER/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Git-Eigentümer erlauben (Container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Absolute Pfade: Die Cache-Aktion läuft als root (HOME=/github/home),
      # cargo als Prüfbenutzer mit CARGO_HOME=/home/pruefer/.cargo.
      - name: Cargo-Cache
        uses: actions/cache@v4
        with:
          path: |
            /home/pruefer/.cargo/registry/index
            /home/pruefer/.cargo/registry/cache
            /home/pruefer/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Nach Checkout und Cache: alles, was cargo schreibt, gehört dem Prüfbenutzer.
      - name: Arbeitsbereich dem Prüfbenutzer übereignen
        run: |
          install -d -m 700 -o "$PRUEFER" -g "$PRUEFER" "$XDG_RUNTIME_DIR"
          chown -R "$PRUEFER:$PRUEFER" "$GITHUB_WORKSPACE" "/home/$PRUEFER"
          runuser -u "$PRUEFER" -- sh -c 'id; echo "HOME=$HOME USER=$USER LANG=$LANG"; cargo --version'

      - name: Format
        run: runuser -u "$PRUEFER" -- cargo fmt --all --check

      # Clippy mit allen Features (rar): ohne rar meldet der Upstream-Code in
      # src/adapters/mod.rs ungenutzte Importe (MAYBE_BAD_PASSWORD, PASSWORD_REQUIRED).
      - name: Clippy (alle Features)
        run: runuser -u "$PRUEFER" -- cargo clippy --all-targets --locked --all-features -- -D warnings

      - name: Tests (ohne Bildschirm, ohne UnRAR)
        run: runuser -u "$PRUEFER" -- cargo test --locked --no-default-features

      - name: Lizenzen der Abhängigkeiten (Information)
        if: always()
        run: |
          runuser -u "$PRUEFER" -- cargo metadata --locked --format-version 1 \
            | python3 -c "import json,sys,collections; m=json.load(sys.stdin); c=collections.Counter(p.get('license') or 'KEINE ANGABE' for p in m['packages'] if p['source']); [print(n,l) for l,n in c.most_common()]"
